version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lenny_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lenny:password@db:5432/lenny_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://lenny:password@db:5432/lenny_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TRANSCRIPTS_DIR=/data/lenny-transcripts/episodes
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ${TRANSCRIPTS_HOST_DIR:-./data/lenny-transcripts}:/data/lenny-transcripts
    command: python scripts/ingest_transcripts.py
    restart: "no"

volumes:
  pgdata:
